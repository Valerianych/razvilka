<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17171d">
  <meta name="description" content="Развилка — рабочее пространство для карты сюжета, лора и диалогов визуальной новеллы.">
  <title>Развилка — карта сюжета</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="icons.js" defer></script>
  <script src="model.js" defer></script>
  <script src="map.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="studio">
    <header class="topbar">
      <button class="brand" data-action="page" data-page="map" aria-label="Развилка, к карте сюжета"><img src="assets/mark.svg" alt="" width="32" height="32"><span>Развилка</span></button>
      <nav class="main-nav" aria-label="Разделы проекта" id="main-nav"></nav>
      <div class="top-tools"><span id="save-state" title="Проект сохраняется в этом браузере"></span><span class="tool-divider"></span><button id="file-menu" class="file-button" data-action="file-menu" aria-label="Файл и настройки проекта" aria-haspopup="true"></button></div>
    </header>
    <section id="project-cover" class="project-cover" aria-label="Текущий проект">
      <div class="cover-inner"><button class="projects-link" data-action="projects"><span data-icon="folder"></span>Мои проекты<span data-icon="chevron-right"></span></button><h1 id="project-title"></h1><div id="project-meta" class="project-meta"></div></div>
      <button class="read-button" data-action="play"><span data-icon="play"></span><span>Пройти историю</span></button>
    </section>
    <main class="workbench"><div class="workbar" id="workbar"></div><div id="workspace" class="workspace"></div></main>
    <footer id="statusbar" class="statusbar"></footer>
  </div>
  <div id="menu" class="popover" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" accept="application/json,.json" id="import-file" hidden>
</body>
</html>
